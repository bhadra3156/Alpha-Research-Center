[tool.poetry]
name = "alpharesearch-backend"
version = "1.0.0"
description = "AlphaResearch Institutional Equity Intelligence Engine — Backend"
authors = ["AlphaResearch Team"]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"
httpx = "^0.28.0"
yfinance = "^0.2.48"
pandas = "^2.2.0"
numpy = "^2.1.0"
anthropic = "^0.40.0"
supabase = "^2.9.0"
sqlalchemy = "^2.0.36"
alembic = "^1.14.0"
apscheduler = "^3.10.4"
python-dotenv = "^1.0.1"
requests = "^2.32.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
httpx = "^0.28.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
